name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kubenautas
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: kubenautas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U kubenautas -d kubenautas_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://kubenautas:test-only-password@localhost:5432/kubenautas_test
      - run: pnpm build
      - run: docker build --target api -t kubenautas-api:ci .
      - run: docker build --target web -t kubenautas-web:ci .
