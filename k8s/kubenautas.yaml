# Create the kubenautas-api secret and provide an accessible PostgreSQL database.
# See README.md. Replace example.com with your HTTPS ingress hostname.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubenautas-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: kubenautas-api }
  template:
    metadata:
      labels: { app: kubenautas-api }
    spec:
      containers:
        - name: api
          image: kubenautas-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef: { name: kubenautas-api }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: TRUST_PROXY, value: "1" }
            - { name: FRONTEND_URL, value: "https://example.com" }
            - { name: API_PUBLIC_URL, value: "https://example.com/api" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kubenautas-api
spec:
  selector: { app: kubenautas-api }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubenautas
spec:
  replicas: 2
  selector:
    matchLabels: { app: kubenautas }
  template:
    metadata:
      labels: { app: kubenautas }
    spec:
      containers:
        - name: web
          image: kubenautas-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: API_UPSTREAM, value: "kubenautas-api:3000" }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubenautas
spec:
  selector: { app: kubenautas }
  ports:
    - port: 80
      targetPort: 8080
