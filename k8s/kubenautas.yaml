# Pratique o que aprendeu: rode o Kubenautas no seu próprio cluster.
#   docker build -t kubenautas:1.0 .
#   kind load docker-image kubenautas:1.0      # se usar kind
#   kubectl apply -f k8s/kubenautas.yaml
#   kubectl port-forward svc/kubenautas 8080:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubenautas
  labels: { app: kubenautas }
spec:
  replicas: 2
  selector:
    matchLabels: { app: kubenautas }
  template:
    metadata:
      labels: { app: kubenautas }
    spec:
      containers:
        - name: web
          image: kubenautas:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubenautas
spec:
  selector: { app: kubenautas }
  ports:
    - port: 80
      targetPort: 8080
